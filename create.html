<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타터팩 만들기 — PACKME 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .wizard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 32px; align-items: start; }
  @media (max-width: 860px) {
    .wizard-grid { grid-template-columns: 1fr; }
    .wizard-grid .preview-col { order: -1; }
  }
  .preview-col { position: sticky; top: 20px; }
  .step-panel { display: none; }
  .step-panel.active { display: flex; flex-direction: column; gap: 20px; }
  .state-row { display: flex; align-items: center; gap: 16px; }
  .state-row .emoji-disc { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; background: #fff; flex: none; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="badge">2026</span> PACKME</a>
    <div class="spacer"></div>
    <div class="steps" id="stepsBreadcrumb"></div>
  </header>

  <main class="wrap">
    <div class="col gap-16" style="margin-bottom:20px;">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:25%;"></div></div>
    </div>

    <div class="wizard-grid">
      <div>
        <!-- Step 1: 아키타입 -->
        <section class="step-panel" data-step="1">
          <h2 class="t-lg">나를 가장 잘 설명하는 아키타입을 골라보세요</h2>
          <div class="tile-grid" id="archetypeGrid"></div>
          <div class="row justify-between align-center">
            <a class="btn secondary" href="index.html">만들기 화면으로</a>
            <button class="btn primary" id="toStep2" disabled>현재 상태 선택하기</button>
          </div>
        </section>

        <!-- Step 2: 현재 상태 -->
        <section class="step-panel" data-step="2">
          <h2 class="t-lg">지금 당신의 상태는?</h2>
          <p class="t-sm">현재 상태가 포스터의 배경 톤과 결과 분위기를 결정합니다.</p>
          <div class="col gap-12" id="stateList"></div>
          <div class="row justify-between align-center">
            <button class="btn secondary" id="toStep1">1단계로</button>
            <button class="btn primary" id="toStep2Next" disabled>3단계: 구성품 선택</button>
          </div>
        </section>

        <!-- Step 3: 구성품 3개 -->
        <section class="step-panel" data-step="3">
          <h2 class="t-md">구성품 선택</h2>
          <div class="box tight" id="prevChoicesBox"></div>

          <div class="col gap-8">
            <div class="t-md">취향</div>
            <div class="t-sm">나를 가장 잘 나타내는 취향을 하나 고르세요.</div>
            <div class="chip-row" id="tasteChips"></div>
          </div>
          <div class="col gap-8">
            <div class="t-md">소지품</div>
            <div class="t-sm">늘 들고 다니는 필수품을 하나 고르세요.</div>
            <div class="chip-row" id="belongingChips"></div>
          </div>
          <div class="col gap-8">
            <div class="t-md">습관</div>
            <div class="t-sm">루틴처럼 반복하는 습관을 하나 고르세요.</div>
            <div class="chip-row" id="habitChips"></div>
          </div>

          <div class="box tight">
            <div class="t-sm" style="margin-bottom:8px;">현재 선택 요약</div>
            <div class="summary-grid" id="componentSummary"></div>
          </div>

          <div class="row justify-between align-center">
            <button class="btn secondary" id="toStep2Back">2단계로 돌아가기</button>
            <button class="btn primary" id="toStep4" disabled>4단계로 이동하기</button>
          </div>
        </section>

        <!-- Step 4: 결과 톤 -->
        <section class="step-panel" data-step="4">
          <h2 class="t-md">어떤 분위기로 완성할까요?</h2>
          <p class="t-sm">포스터의 결과 문구, 컬러 테마, 폰트 스타일이 선택한 톤으로 바뀝니다.</p>
          <div class="col gap-12" id="toneList"></div>
          <div class="row justify-between align-center">
            <button class="btn secondary" id="toStep3">3단계로 돌아가기</button>
            <button class="btn accent" id="finishBtn" disabled>포스터 완성하기</button>
          </div>
        </section>
      </div>

      <div class="preview-col col gap-12">
        <div class="t-sm">실시간 미리보기</div>
        <div class="poster-frame" id="previewFrame" data-tone="positive">
          <canvas id="previewCanvas"></canvas>
        </div>
        <p class="poster-caption-hint">선택하면 즉시 반영됩니다. 선택값은 이 브라우저에만 저장됩니다.</p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/poster.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/wizard.js"></script>
</body>
</html>
